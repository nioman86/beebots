name: beebots
services:
  laya:
    image: beebots-laya:local
    build:
      context: ./laya
    restart: always
    labels:
      - "net.unraid.docker.managed=composeman"
    environment:
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "8000"
      LAYA_PRELOAD: "1"          # load at boot (downloads english checkpoint on first boot)
      LAYA_MODELS: "english"     # only what the engine needs
      LAYA_JEV_STRICT: "1"       # project response onto the exact Jev wire contract beebots decodes
      LAYA_THREADS: "4"          # CPU threads; keep <= physical cores
      HF_HOME: /home/laya/.cache/huggingface
    volumes:
      - laya-cache:/home/laya/.cache/huggingface
    networks:
      - beebots                   # private only; never exposed
    expose:
      - "8000"

  engine:
    image: beebots-engine:local
    build:
      context: .
    restart: always
    labels:
      - "net.unraid.docker.managed=composeman"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    env_file:
      - path: .env
        required: false
    environment:
      TYPESAFE_API_KEY: "local-laya-placeholder"  # satisfies required field; Laya ignores it
      JEV_BASE_URL: "http://laya:8000"           # reach Laya on the compose network by service name
      JEV_USD_PER_MTOK: "0"      # free local model -> daily cap never trips
      JEV_TIMEOUT_MS: "8000"     # CPU headroom on a 10s tick; ~hundreds-on-ms inference
      TICK_MS: "10000"
      JEV_MODEL: "jev-1.13.0"    # arbitrary; Laya routes to its english checkpoint
      ENGINE_BIND: "0.0.0.0"  # LISTEN ON ALL IFACES so web/Caddy (separate container) can proxy to :8080
      SETTINGS_PATH: /data/settings.json
      DB_PATH: /data/bees-{mode}.sqlite
      # Where the Beekeeper's Hermes profile finds this engine. Reachable on VLAN 30 at the Caddy IP.
      PUBLIC_URL: ${PUBLIC_URL:-http://10.0.30.62}
    volumes:
      - bees-data:/data
    networks:
      - beebots                   # private only
    expose:
      - "8080"
    depends_on:
      - laya
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  web:
    image: ghcr.io/imikerussell/beebots-web:latest
    restart: always
    labels:
      - "net.unraid.docker.managed=composeman"
      - "net.unraid.docker.webui=http://10.0.30.62"
    depends_on: [engine, laya]
    user: "1000:1000"
    sysctls: { net.ipv4.ip_unprivileged_port_start: 0 }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Dual-homed: internal beebots bridge (reach engine:8080) + br0.30 static IP for the outside world.
    networks:
      beebots:
      br0.30:
        ipv4_address: "10.0.30.62"
    environment:
      SITE_ADDRESS: ":80"        # serves :80 on its OWN 10.0.30.62 IP; no host-ip collision with nginx
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - /mnt/user/appdata/beebots/web-overlay/index-CM-R2CrU.laya.js:/srv/dashboard/assets/index-CM-R2CrU.laya.js:ro
      - /mnt/user/appdata/beebots/web-overlay/index.html:/srv/dashboard/index.html:ro
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  backup:
    image: ghcr.io/imikerussell/beebots-backup:latest
    restart: always
    labels:
      - "net.unraid.docker.managed=composeman"
    depends_on: [engine]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks:
      - beebots                   # private only
    volumes:
      - bees-data:/data

networks:
  beebots:                        # internal bridge: laya/engine/backup never exposed
    driver: bridge
  br0.30:                         # Unraid's existing macvlan on Services-Private/VLAN 30
    external: true

volumes:
  bees-data:
  caddy-data:
  caddy-config:
  laya-cache: